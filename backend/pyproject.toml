[project]
name = "alovia-backend"
version = "0.5.0"
requires-python = ">=3.14"

[tool.ruff]
line-length = 100
target-version = "py314"
# the owner's training notebooks are kept as written (DEC-076); never reformat them
extend-exclude = ["ml_training"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
explicit_package_bases = true

# The ML code is moved unchanged from ml-test (ml_models_spec.md §0), so it keeps its
# original, partly untyped signatures; the ML libraries ship no type stubs.
[[tool.mypy.overrides]]
module = "app.modules.predictions.risk_model"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_any_generics = false
warn_return_any = false
disable_error_code = ["call-overload"]

[[tool.mypy.overrides]]
module = ["joblib", "pandas", "shap", "sklearn.*", "xgboost.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
