# Pregnancy Journey settings (pregnancy_journey_module_spec.md §14.4, all [CONFIGURABLE]).
# Checked at startup by app/modules/journey/config.py; a wrong value stops the backend.

content_source: prototype          # prototype | knowledge_base (§8.2: switching is config only)
show_prototype_banner: true        # §8.3: required while prototype content is active
assistant_enabled: false           # §8.5: hidden until the RAG module is built (Phase 7)
suggested_checkups_enabled: true   # §9.2: on since the official schedule below was copied (R3, owner 2026-11-18)
timezone: Asia/Kolkata             # §6.1: "today" is the patient's local date

# §6.3 week-to-month mapping, display only. [CONFIRM AT REVIEW] (R1)
month_map:
  - { month: 1, weeks: [0, 4] }
  - { month: 2, weeks: [5, 8] }
  - { month: 3, weeks: [9, 13] }
  - { month: 4, weeks: [14, 17] }
  - { month: 5, weeks: [18, 22] }
  - { month: 6, weeks: [23, 27] }
  - { month: 7, weeks: [28, 31] }
  - { month: 8, weeks: [32, 35] }
  - { month: 9, weeks: [36, 42] }

term_from_week: 37                 # §6.4 calendar marker
appointment_notice_hours: 24       # §10.1 appointment_soon
resume_window_days: 7              # §11.6 "I marked this by mistake"

# §4.1 nav bar, served from here (DEC-040). DEC-112 (2026-11-21, FRONTEND_REDESIGN §7.4): five
# items with Log as the raised centre action; Doctor notes moved under More. The bar label for
# appointments is "Visits" so all five fit at 375 px (owner, 2026-11-21); the page title stays.
nav_items:
  - { key: home, label: Home }
  - { key: calendar, label: Calendar }
  - { key: log_symptoms, label: Log }
  - { key: appointments, label: Visits }
  - { key: more, label: More }

# §9.2 suggested check-ups (R3). Copied 2026-11-18 from the official NHM (MoHFW) Maternal Health
# page. The MCP card (S4) gives no week-by-week visit timing ("Have at least 3 antenatal
# checkups, after registration"), so only PMSMA's fixed day is used. "2nd & 3rd trimesters"
# = from week 14 (§6.2). Shown as a dashed "suggested" label, never as an appointment.
suggested_checkups:
  label: PMSMA check-up day
  day_of_month: 9
  from_week: 14
  source:
    publisher: National Health Mission, Ministry of Health and Family Welfare, Government of India
    title: Maternal Health
    url: https://nhm.gov.in/index1.php?lang=1&level=2&sublinkid=822&lid=218
    quote: "provides fixed-day assured, comprehensive and quality antenatal care to all pregnant women in 2nd& 3rd trimesters on the 9th of every month"
    date_accessed: 2026-11-18
