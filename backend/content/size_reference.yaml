# Prototype size reference (journey spec §7.2, DEC-043): weeks 14-40, the range of the WHO
# chart. Weeks without a row (0-13, 41-42) show no size comparison (§15 test 7).
# review_status stays unreviewed until a doctor confirms each week's comparison object (R2).
#
# Weights: WHO Fetal Growth Charts, Table 11 ("Growth chart for estimated fetal weight
# regardless of fetal sex"), 50th percentile, grams — read from the published table image
# (doi:10.1371/journal.pmed.1002220.t011, CC BY 4.0, downloaded 2026-11-17): weeks 14, 16, 20,
# 24, 28, 32 and 36 transcribed on 2026-11-17, the other weeks on 2026-11-18. No value was
# estimated or interpolated. Lengths: none (the chart gives weight only).
#
# Comparison objects: Microsoft Fluent Emoji (MIT), icons in
# frontend/apps/patient-web/public/icons/fluent/. Object choices are the agent's DRAFT,
# preferring objects familiar in India (DEC-043); neighbouring weeks may share an object.
# A doctor reviews each one (R2).
sizes:
