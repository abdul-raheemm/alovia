    weight_g: 90
    object_icon_id: lemon
    object_name: lemon
    source: &who
      publisher: "Kiserud T et al., PLOS Medicine (WHO Fetal Growth Charts)"
      title: "Table 11: Growth chart for estimated fetal weight regardless of fetal sex (50th percentile)"
