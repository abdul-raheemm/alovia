    granularity: week_range
    week_start: 0
    week_end: 42
    content_type: checklist
    title: "Taking care of your health while you're pregnant"
    body: |-
      - Have regular visits with your health care provider.
      - Eat healthy and drink plenty of water.
      - Take prenatal vitamins.
      - Be careful with medicines. Always check with your provider before you start or stop any medicine.
      - Stay active.
      - Avoid substances that could hurt your baby, including alcohol, drugs, and tobacco.
